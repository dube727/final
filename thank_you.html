<! Here I use Java to make a confetti animation>
  <script>
    const canvas = document.getElementById("confetti-canvas");
    const ctx = canvas.getContext("2d");

    let W = window.innerWidth;
    let H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;

    const confetti = [];


    for (let i = 0; i < 150; i++) {
      confetti.push({
        x: Math.random() * W,
        y: Math.random() * H - H,
        r: Math.random() * 6 + 4,
        d: Math.random() * 100 + 10,
        color: `hsl(${Math.random() * 360}, 100%, 50%)`,
        tilt: Math.floor(Math.random() * 10) - 10,
        tiltAngle: 0,
      });
    }


    function draw() {
      ctx.clearRect(0, 0, W, H);
      confetti.forEach((c) => {
        ctx.beginPath();
        ctx.fillStyle = c.color;
        ctx.ellipse(c.x, c.y, c.r, c.r / 2, c.tilt, 0, Math.PI * 2);
        ctx.fill();
      });
      update();
    }


    function update() {
      confetti.forEach((c) => {
        c.y += Math.cos(c.d / 100) + 2;
        c.x += Math.sin(c.d / 100);
        if (c.y > H) {
          c.y = -10;
          c.x = Math.random() * W;
        }
      });
    }

    setInterval(draw, 33); // Refresh animation ~30 times/second
  </script>
</body>
