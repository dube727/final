<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Aaron Dube's Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error {
            color: red;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">Aaron Dube's Website</a>
        <div>
            <a class="nav-link d-inline" href="index.html">Home</a>
            <a class="nav-link d-inline" href="careers.html">Careers</a>
            <a class="nav-link d-inline" href="family.html">Family</a>
            <a class="nav-link d-inline" href="music.html">Music</a>
            <a class="nav-link d-inline" href="movies_tv.html">Movies & TV</a>
            <a class="nav-link d-inline" href="education.html">Education</a>
            <a class="nav-link d-inline" href="contact.html">Contact Me</a>
        </div>
    </div>
</nav>

<section>
    <div class="container py-4">
        <h1>Contact Me</h1>
        <p>If you'd like to get in touch, please fill out the form below.</p>

        <form id="contactForm">
            <div class="mb-3">
                <label for="name" class="form-label">Name:</label>
                <input type="text" class="form-control" id="name">
                <div id="nameError" class="error"></div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address:</label>
                <input type="email" class="form-control" id="email">
                <div id="emailError" class="error"></div>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</section>

<footer>
    <p class="text-center py-3">© 2005 Aaron Dube</p>
</footer>

<! JavaScript for validation>
<script>
    document.getElementById("contactForm").addEventListener("submit", function (e) {
        e.preventDefault();

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let nameError = document.getElementById("nameError");
        let emailError = document.getElementById("emailError");

       
        nameError.textContent = "";
        emailError.textContent = "";

        let isValid = true;

      
        if (name === "") {
            nameError.textContent = "Please enter your name.";
            isValid = false;
        }

  
        if (email === "") {
            emailError.textContent = "Please enter your email.";
            isValid = false;
        } else if (!/^\S+@\S+\.\S+$/.test(email)) {
            emailError.textContent = "Please enter a valid email address.";
            isValid = false;
        }


        if (isValid) {
            alert("Thank you! Your information is valid.");
            window.location.href = "thank_you.html";
        }
    });
</script>

</body>
</html>
